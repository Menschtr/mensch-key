name: rotate-key
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: key-rotate
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate and commit key
        run: |
          set -euo pipefail
          SEED="${{ secrets.KEY_SEED }}"
          if [ -z "$SEED" ]; then SEED="mensch-default-seed"; fi
          slot=$(( $(date +%s) / 300 ))
          key=$(python3 - "$SEED" "$slot" <<'PY'
          import sys
          seed, slot = sys.argv[1], int(sys.argv[2])
          def djb2(s):
              h = 5381
              for c in s.encode():
                  h = ((h * 33) + c) & 0xFFFFFFFF
              return h
          h1 = djb2(seed + '|' + str(slot))
          h2 = djb2(str(slot) + '|' + seed)
          print((('%08X' % h1) + ('%08X' % h2))[:10])
          PY
          )
          expires=$(( (slot + 1) * 300 ))
          printf '{"slot":%d,"key":"%s","expires":%d}\n' "$slot" "$key" "$expires" > current-key.json
          cat current-key.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-key.json
          if git diff --cached --quiet; then
            echo "no change; nothing to commit"
          else
            git commit -m "rotate key (slot $slot)"
            git push
          fi