name: rotate-key
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: key-rotate
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate and commit key
        run: |
          set -euo pipefail
          SEED="${{ secrets.KEY_SEED }}"
          if [ -z "$SEED" ]; then SEED="mensch-default-seed"; fi
          slot=$(( $(date +%s) / 300 ))
          digest=$(printf '%s|%s' "$SEED" "$slot" | openssl dgst -sha256 | awk '{print $2}')
          key=$(printf '%s' "$digest" | cut -c1-10 | tr '[:lower:]' '[:upper:]')
          expires=$(( (slot + 1) * 300 ))
          mkdir -p site
          printf '{"slot":%d,"key":"%s","expires":%d}\n' "$slot" "$key" "$expires" > site/current-key.json
          cat site/current-key.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/current-key.json
          if git diff --cached --quiet; then
            echo "no change; nothing to commit"
          else
            git commit -m "rotate key (slot $slot)"
            git push
          fi